method: searched
docs: https://docs.kinde.com/developer-tools/kinde-api/api-scopes/
source: >-
  https://docs.kinde.com/developer-tools/kinde-api/api-scopes/ ("Kinde Management API Scopes",
  last updated 2026-05-02) for the Management API scope table;
  https://app.kinde.com/.well-known/openid-configuration (probed 2026-09-12, HTTP 200) for
  scopes_supported on the OIDC surface; https://docs.kinde.com/mcp-servers/operations-and-scopes/
  for the MCP subset. The derive-oauth-scopes.py baseline produced nothing because the published
  OpenAPI declares only an http/bearer securityScheme with no oauth2 flows block — the scope model
  is real and documented, but it is absent from the machine-readable contract.
provider: Kinde
providerId: kinde
description: >-
  Kinde operates three distinct scope namespaces. (1) OIDC scopes on the authorization endpoint,
  published in the discovery document. (2) Management API M2M scopes in verb:resource form, granted
  per M2M application and narrowable per token. (3) The MCP subset, restricted to read and create
  only. The Management API scope model is granular and well documented, but it does NOT appear in
  the OpenAPI, so a generated SDK cannot tell a caller which scope an operation needs.
contract_gap:
  spec_declares_oauth2: false
  spec_security_schemes: [kindeBearerAuth (http/bearer, JWT)]
  consequence: >-
    All 169 Management API operations declare a 403, but the contract never says which scope
    prevents it. The scope-to-operation mapping exists only in prose. This is the single largest
    machine-readability gap in an otherwise strong contract.
