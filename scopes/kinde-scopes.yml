mcp_scope_subset:
  docs: https://docs.kinde.com/mcp-servers/operations-and-scopes/
  policy: read-and-create-only
  rationale: >-
    Kinde will not grant update: or delete: scopes to an MCP server, stating that AI clients can
    misinterpret requests or hallucinate.
  scopes:
    - 'read:users'
    - 'read:user_identities'
    - 'read:organizations'
    - 'read:organization_users'
    - 'read:feature_flags'
    - 'read:roles'
