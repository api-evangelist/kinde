  granted_at: M2M application (Settings > Applications > APIs > Manage scopes)
  token_narrowing: >-
    Pass a space-delimited `scope` parameter in the client_credentials token request body to issue
    a token carrying fewer scopes than the application holds.
  docs: https://docs.kinde.com/developer-tools/kinde-api/api-scopes/
  completeness_note: >-
    Kinde describes this table as "the most commonly used scopes" and says the dashboard shows the
    full list when configuring an M2M application. It is therefore a published subset, not a
    guaranteed-complete enumeration.
  groups:
    - group: Users
