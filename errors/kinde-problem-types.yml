description: >-
  Kinde publishes three separate and non-overlapping error vocabularies: the HTTP status contract of
  the Management API, the RFC 6749 error values returned by the OAuth 2.0 token endpoint, and a set
  of numeric platform error codes surfaced to end users during authentication flows. The third set
  is unusual and genuinely useful — most identity providers do not publish their internal auth-flow
  failure codes at all.
