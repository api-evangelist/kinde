apis:
- aid: kinde:kinde-mcp-server
  name: Kinde MCP Server
  description: >
    The Kinde MCP (Model Context Protocol) server acts as a bridge between AI assistants and a Kinde account.
    It exposes a subset of the Kinde Management API as MCP tools (query organizations, check user existence
    by email, retrieve user roles, list users in an organization, manage users and permissions), authenticated
    via an environment-level API key whose scopes constrain which tools the AI client can call.
  humanURL: https://docs.kinde.com/mcp-server/about-mcp-server/
  tags:
  - MCP
  - AI Agents
  - Identity
  tags_raw:
  - MCP
  - AI Agents
  - Model Context Protocol
  - Identity
  properties:
  - type: Documentation
    url: https://docs.kinde.com/mcp-server/about-mcp-server/
