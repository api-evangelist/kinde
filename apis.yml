apis:
- aid: kinde:kinde-mcp-server
  name: Kinde MCP Server
  description: >
    The Kinde Management MCP server bridges AI agents and a Kinde account. It is TENANT-SCOPED — the
    endpoint is https://{subdomain}.kinde.com/mcp, one per Kinde business — and is authenticated with an
    Environment API key whose scopes constrain the available tools. It publishes 22 tools across users,
    organizations, roles, permissions and configuration. Crucially the server is restricted to READ AND
    CREATE scopes only: Kinde grants it no update: or delete: scopes at all, stating that AI clients can
    misinterpret requests or hallucinate, so an agent can query and create but cannot modify or destroy
    existing records. Separately, Kinde SELLS MCP server generation over a customer's own OpenAPI
    ("Kinde Secure MCP", beta, launched July 2026), which makes Kinde a producer of MCP infrastructure
    for other companies as well as a consumer-facing MCP publisher.
  humanURL: https://docs.kinde.com/mcp-servers/
  baseURL: https://{subdomain}.kinde.com/mcp
  tags:
  - MCP
  - AI Agents
  - Identity
  tags_raw:
  - MCP
  - AI Agents
  - Model Context Protocol
  - Identity
  properties:
  - type: MCPServer
    url: mcp/kinde-mcp.yml
    x-description: 22 published tools with scopes; remote + stdio-bridge deployment, tenant-scoped endpoint
  - type: ToolCrosswalk
    url: mcp/kinde-tool-crosswalk.yml
    x-description: All 22 tools bound one-to-one to Management API operationIds; 157 REST operations have no tool
  - type: Documentation
