  current: v1
  since: launch
  policy_published: false
  breaking_change_notice: not-published
  header_negotiation: false
deprecation:
  policy_published: false
  rfc8594_sunset_header: false
  rfc8594_deprecation_header: false
  evidence: >-
    No Sunset or Deprecation response header is documented or declared in either OpenAPI. No
    deprecation policy page exists in the docs corpus. Neither published spec marks any operation
    `deprecated: true` — 0 of 179 refined operations.
  deprecated_operations: []
  deprecated_packages:
