provider: Kinde
providerId: kinde
description: >-
  Kinde runs an operational status page and a public changelog/roadmap, but publishes no API
  versioning policy, no deprecation policy, and no Sunset/Deprecation header commitment. The
  deprecation signal that DOES exist is in the SDK estate, where six repositories are archived —
  that is the only place Kinde tells a consumer something has been retired.
versioning:
