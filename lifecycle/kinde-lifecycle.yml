      replacement: '@kinde-oss/kinde-remix-sdk'
    - name: nuxt-kinde
      repository: https://github.com/kinde-oss/nuxt-kinde
      state: archived
      last_push: '2023-10-19'
      replacement: not-stated
      note: >-
        apis.yml still advertises this as a current SDK. The repository has been archived since
