description: 'Complete crosswalk between the Kinde Management MCP Server tool surface and the Kinde Management
  API. All 22 published tools bind one-to-one to a real operationId, so each tool''s true inputSchema
  is the parameters + requestBody of the operation named in rest[]. The striking number is the other direction:
  the REST API exposes 169 operations and the MCP server exposes 22, so 157 REST operations — including
  every update and every delete — have no agent-reachable tool. That gap is deliberate, not an oversight;
  see safety_posture in mcp/kinde-mcp.yml.'
