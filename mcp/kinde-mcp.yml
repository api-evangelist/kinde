provider: Kinde
providerId: kinde
status: published
description: >-
  Kinde ships TWO distinct MCP surfaces and they must not be conflated.
  (1) The Kinde Management MCP Server: a Kinde-authored remote MCP server exposing a read-and-create
  subset of the Kinde Management API. It is TENANT-SCOPED — the endpoint is
  https://{subdomain}.kinde.com/mcp, one per Kinde business, not a single shared host.
  (2) Kinde MCP Connections: a PRODUCT, not a server — customers upload their own OpenAPI and Kinde
  generates an MCP server in front of it, with Kinde handling the user-level API key auth. That is
  Kinde selling MCP infrastructure, and it is recorded here as a capability, not as a Kinde tool list.
deployment:
  mode: both
  endpoint: https://{subdomain}.kinde.com/mcp
  install: >-
    claude mcp add --transport http kinde https://YOUR_BUSINESS.kinde.com/mcp --header
    "Authorization: Bearer YOUR_API_KEY"
  package: https://github.com/kinde-oss/kinde-cli
  auth: api-key
  verified: searched
  checked: '2026-09-12'
  note: >-
    mode is `both` because Kinde publishes a Remote MCP (HTTP) config AND a Stdio bridge config
    for the same tenant endpoint — the docs' Quick start page offers both JSON blocks side by side
    (Remote MCP for Cursor/VS Code, Stdio bridge for Claude Desktop). The stdio bridge is a
    transport shim in front of the same remote URL, not a separately published package.
  endpoint_template:
    pattern: https://{subdomain}.kinde.com/mcp
    variable: subdomain
    description: The Kinde subdomain generated for your business (e.g. acme for acme.kinde.com).
    verbatim_from_docs: https://YOUR_BUSINESS.kinde.com/mcp
transport:
  remote: streamable-http
  stdio_bridge: true
authentication:
  type: bearer
  credential: Kinde Environment API key
  header: 'Authorization: Bearer YOUR_API_KEY'
  provisioning: >-
    Settings > APIs > Kinde Management API > View details > API Keys > Add API Key, with the
    "Can be used by the Kinde MCP server" option checked and the desired scopes selected.
  scope_model: >-
    The MCP server can only be granted a subset of Management API scopes. Kinde deliberately
    restricts it to read (get) and create scopes — no update and no delete — so an agent that
    misreads an instruction cannot modify or destroy existing records.
  docs: https://docs.kinde.com/mcp-servers/manage-kinde-account-with-ai-agents/
probe:
  date: '2026-09-12'
  host: mcp.kinde.com
  method: POST /mcp with {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  http_status: 202
  result: waf-challenge
  detail: >-
    mcp.kinde.com returns 202 with a zero-length body and `x-amzn-waf-action: challenge` for every
    path and method, including GET /. It is an AWS WAF-fronted host, not the documented MCP
    endpoint. A prior round of this pipeline recorded mcp.kinde.com/mcp as the server URL; the
    provider's own documentation names https://{subdomain}.kinde.com/mcp instead, and that is the
    value carried above. The tenant endpoint was NOT probed because it requires a Kinde business
    subdomain and an Environment API key.
  tools_list_captured: false
