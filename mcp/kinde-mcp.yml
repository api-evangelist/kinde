safety_posture:
  write_restriction: read-and-create-only
  stated_rationale: >-
    "As AI can misinterpret requests or hallucinate, the scopes that the Kinde MCP server can be
    assigned are currently limited to gets and creates only. This ensures that AI clients can query
    information and create new resources, but cannot modify or delete existing data, providing an
    additional layer of safety when using AI to interact with your Kinde account."
  source: https://docs.kinde.com/mcp-servers/operations-and-scopes/
  assessment: >-
    This is a genuine agent-safety design decision and a rare one: of the 169 operations in the
    Management API, the MCP server exposes 22, and zero of them are destructive. The reversibility
    question for this surface is therefore narrow — the only irreversible-through-MCP actions are
    the seven creates, and each has a corresponding delete available on the REST API but NOT
    through MCP.
mcp_connections_product:
  description: >-
    Separate from its own server, Kinde sells MCP-server generation: a customer registers an
    OpenAPI (the first servers[] entry becomes the upstream base URL), Kinde parses it to generate
    scopes, and Kinde fronts it as an MCP connection with per-user API keys
    (format k_live_...). Clients get a unique connection URL plus Remote MCP and Stdio bridge configs.
  status: beta
  docs: https://docs.kinde.com/mcp-servers/add-mcp-connection/
  scopes:
    - scope: read:apis
      description: View connections, tools, audit
    - scope: update:apis
      description: Create, delete, authorize APIs, configure backend auth
  note: >-
    This makes Kinde a PRODUCER of MCP infrastructure for other companies' APIs. It is recorded
    for accuracy but is not a Kinde agent surface and contributes no tools to the list above.
