token_verification:
  algorithm: RS256
  key_size: RSA 2048-bit
  hash: SHA-256
  jwks: https://{subdomain}.kinde.com/.well-known/jwks
  public_endpoint: true
  gotcha: The JWKS endpoint is public. Sending an Authorization header to it causes a 403 — a documented
    and commonly-hit failure. Fetch it server-side to avoid CORS restrictions.
  first_party_libraries:
  - '@kinde/jwt-validator'
  - '@kinde/jwt-decoder'
  docs: https://docs.kinde.com/build/tokens/verify-jwts/
