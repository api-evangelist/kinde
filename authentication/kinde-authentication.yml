docs: https://docs.kinde.com/developer-tools/kinde-api/access-token-for-api/
description: 'The published contract declares a single http/bearer scheme, which under-describes what
  Kinde actually operates. In practice there are THREE distinct credential paths: an M2M client-credentials
  flow for the Management API, an end-user access token for the Account API, and k_live_-prefixed API
  keys for customer-registered APIs and the MCP server. The scheme description in the spec is also misleading
  — it says to use "a user token" obtained when users sign in, which is true for the Account API but wrong
  for the Management API, whose 169 operations require an M2M token with an audience parameter.'
contract_gap:
  oauth2_declared_in_spec: false
  scopes_declared_in_spec: false
  note: All 169 Management API operations declare a 403 but the contract never states which scope prevents
    it. The scope model exists only in prose. See scopes/kinde-scopes.yml.
credential_paths:
- name: Management API (M2M)
  grant: client_credentials
  token_endpoint: https://{subdomain}.kinde.com/oauth2/token
  audience_required: true
  audience: https://{subdomain}.kinde.com/api
  presentation: 'Authorization: Bearer <JWT>'
  token_format: JWT signed RS256 (RSA 2048 + SHA-256)
  scope_narrowing: Pass a space-delimited scope parameter in the token request body to issue a token carrying
    fewer scopes than the M2M application holds.
  docs: https://docs.kinde.com/developer-tools/kinde-api/access-token-for-api/
- name: Account API (end user)
  grant: authorization_code + PKCE (S256)
  presentation: 'Authorization: Bearer <user access token>'
  note: Resolves relative to the token subject; cannot read another user. Obtained via getToken in any
    Kinde SDK.
  docs: https://docs.kinde.com/developer-tools/account-api/about-account-api/
- name: API keys
  format: k_live_<random>
  levels:
  - environment-level
  - organization-level
  - user-level
  used_for:
  - Kinde MCP server
  - customer-registered APIs protected by Kinde
  lifecycle_operations:
  - createApiKey
  - getApiKey
  - getApiKeys
  - rotateApiKey
  - deleteApiKey
  - verifyApiKey
  note: Shown once at creation. Rotation is a first-class operation; no overlap window is published.
  docs: https://docs.kinde.com/manage-your-apis/about-api-keys/
