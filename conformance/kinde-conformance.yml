      id_token_signing_alg_values_supported ["RS256"], subject_types_supported ["public"],
      claims_supported [aud, exp, iat, iss, sub], scopes_supported includes openid.
  - id: oidc-discovery
    name: OpenID Connect Discovery 1.0
    conforms: true
    domain_standard: true
    evidence: The discovery document is served at the canonical /.well-known/openid-configuration path.
  - id: oauth2-pkce
    name: Proof Key for Code Exchange (RFC 7636)
    conforms: true
    evidence: >-
      code_challenge_methods_supported ["S256"] in the discovery document. Kinde's own engineering
      blog states PKCE is the default flow for public clients
      (https://kinde.com/blog/security/oauth-at-kinde/).
  - id: oauth2-token-introspection
    name: OAuth 2.0 Token Introspection (RFC 7662)
    conforms: true
    evidence: >-
      introspection_endpoint https://app.kinde.com/oauth2/introspect in the discovery document;
      the operation is also published in the Account API OpenAPI at /oauth2/introspect.
  - id: oauth2-token-revocation
    name: OAuth 2.0 Token Revocation (RFC 7009)
    conforms: true
    evidence: >-
      revocation_endpoint https://app.kinde.com/oauth2/revoke in the discovery document; published
      in the Account API OpenAPI at /oauth2/revoke.
  - id: oauth2-device-authorization-grant
    name: OAuth 2.0 Device Authorization Grant (RFC 8628)
    conforms: true
    evidence: >-
      Kinde documents a device authorization flow for TV, CLI and IoT clients, including the
      standard authorization_pending, slow_down and expired_token polling errors
      (https://docs.kinde.com/authenticate/about-auth/authentication-methods/).
    note: Not advertised in the discovery document's grant_types (that key is absent from the body).
  - id: jwt
    name: JSON Web Token (RFC 7519) / JWS RS256
    conforms: true
    evidence: >-
      jwks_uri https://app.kinde.com/.well-known/jwks. Kinde documents RSA 2048-bit keys with
