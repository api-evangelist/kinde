provider: Kinde
providerId: kinde
description: >-
  Kinde's domain is identity, and the domain standards for identity are OAuth 2.0, OpenID Connect
  and SAML 2.0. Kinde conforms to the first two at the contract level — the discovery document is
  the evidence, not a marketing claim — and implements SAML 2.0 as a connection type. The one
  identity standard it does NOT yet ship is SCIM, and that absence is material for exactly the
  enterprise B2B buyer Kinde targets.
conformance:
  # ---- Domain standards for the identity market ----
  - id: oauth2
    name: OAuth 2.0 (RFC 6749)
    conforms: true
    domain_standard: true
    evidence: >-
      https://app.kinde.com/.well-known/oauth-authorization-server returns HTTP 200 with
      authorization_endpoint, token_endpoint, revocation_endpoint and introspection_endpoint.
      response_types_supported ["code"], grant support for authorization_code and
      client_credentials documented at
      https://docs.kinde.com/developer-tools/kinde-api/access-token-for-api/.
  - id: oauth2-authorization-server-metadata
    name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
    conforms: true
    domain_standard: true
    evidence: >-
      https://app.kinde.com/.well-known/oauth-authorization-server, HTTP 200, 2026-09-12.
      Body is byte-identical to the OIDC discovery document (same SHA-1).
