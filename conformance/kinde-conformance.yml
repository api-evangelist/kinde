      Google Workspace, Okta, LastPass, Cloudflare). Documented across
      https://docs.kinde.com/authenticate/enterprise-connections/custom-saml/.
    note: >-
      Kinde is a SAML Service Provider consuming customer IdP assertions. No SP metadata XML
