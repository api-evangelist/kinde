    DISTRIBUTION GAP: kinde-java-sdk tags v3.0.1 on GitHub (2026-08-20) but the newest
    com.kinde coordinate on Maven Central is 2.0.1 (2024-12-10). A Maven consumer cannot
    obtain the 3.x line from the central repository. Recorded as observed, not explained.
  - >-
    The WordPress plugin (kinde-auth, 1.0, 2023-02-15) and the Elixir hex package
    (kinde_sdk, 1.2.0, 2023-06-09) are the two oldest published releases in the estate.
  - >-
    Six repositories in the kinde-oss organization are ARCHIVED and are recorded in
    lifecycle/kinde-lifecycle.yml rather than here.
