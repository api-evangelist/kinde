description: >-
  Kinde publishes a broad first-party SDK estate across eleven registries. Every package below is
  owned by Kinde (the @kinde and @kinde-oss npm scopes, the com.kinde Maven group, the kinde-oss
  GitHub organization). The currency fields expose a clear two-speed estate: the JavaScript /
  TypeScript surface ships continuously (August-September 2026), while the JVM artifacts on Maven
  Central have not moved since December 2024 and the Elixir gem has not moved since June 2023.
notes:
