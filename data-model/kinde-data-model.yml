provider: Kinde
providerId: kinde
description: >-
  Kinde's model has two roots and everything hangs off them: ENVIRONMENT is the tenant boundary and
  ORGANIZATION is the customer boundary. A user is global to the environment but joins many
  organizations, and crucially their roles, permissions and feature-flag values are resolved
  PER ORGANIZATION, not globally — that three-way (user x organization x role) join is the
  structural heart of Kinde's B2B story and the reason most read operations take both an org_code
  and a user_id. Roles, permissions, properties and feature flags are all defined once at the
  environment level and then bound at the organization or user level.
identifier_conventions:
