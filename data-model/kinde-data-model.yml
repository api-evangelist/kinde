    note: Present on 24 schemas.
  - field: code
    form: opaque string
    note: >-
      The most common field in the contract (85 schemas) but overloaded — on a response envelope
      `code` is a status string alongside `message`, while on an organization it is the
      identifier (`org_code`). Readers must disambiguate by context.
  - field: org_code
    form: 'org_<hex>'
    note: The organization identifier used in nearly every nested path.
  - field: user_id
    form: kp:<32 hex> or kp_<32 hex>
    note: >-
      Pattern kp[:_][0-9a-f]{32}, published in the user.updated webhook JSON Schema.
  - field: event_id
    form: 'event_<32 hex>'
    note: Pattern event_[0-9a-f]{32}, on every webhook delivery.
  - field: event type id
    form: 'et_<32 hex>'
    note: 'Example: et_018df239698d29177684be3f5ad1266d'
  - field: api_key
